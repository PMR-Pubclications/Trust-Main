# config/config.yaml
system:
  lab_id: "MOBILE_LAB_01"
  mode: "active_incident"

audio:
  sample_rate: 16000
  wake_word: "Assistant"
  stt_model: "whisper-medium"
  tts_voice: "en_US-police-tactical"

models:
  llm_path: "models/saved_models/forensic_llm.gguf"
  vector_db_path: "models/checkpoints/vector_store"

agencies:
  police:
    endpoint: "http://localhost:5001/api/police"
    report_format: "NIBRS_COMPLIANT"
  fire:
    endpoint: "http://localhost:5002/api/fire"
    report_format: "NFIRS_COMPLIANT"
  ems:
    endpoint: "http://localhost:5003/api/ems"
    report_format: "ePCR_COMPLIANT"
  dot:
    endpoint: "http://localhost:5004/api/dot"
    report_format: "MUTCD_TRAFFIC_ALERT"
  hospital:
    endpoint: "http://localhost:5005/api/health_records"
    report_format: "HL7_FHIR_COMPLIANT"

app_name: "Trust-Shell"
version: "1.2"

# Navigation Categories & Access Rules
categories:
  - id: "trustadmin"
    title: "TRUST ADMIN CONSOLE"
    parent_title: "TrustAdmin"
    restricted: true
  - id: "firstresponder"
    title: "FIRST RESPONDER DISPATCH"
    parent_title: "FirstResponder"
    restricted: false
  - id: "legal"
    title: "LEGAL & REGULATORY"
    parent_title: "Public"
    restricted: false

# Capabilities & Agency Dispatch Endpoints
capabilities:
  - title: "Accounts Liable & Billing"
    url: "accounts_liable.php"
    icon: "&#128184;"
    parent_title: "TrustAdmin"
    allowed_roles: ["trustadmin", "admin"]

  - title: "Police Dispatch (PD)"
    url: "dispatch_pd.php"
    icon: "&#128119;"
    parent_title: "FirstResponder"
    allowed_roles: ["trustadmin", "first_responder", "responder"]

  - title: "Fire & Rescue"
    url: "dispatch_fire.php"
    icon: "&#128293;"
    parent_title: "FirstResponder"
    allowed_roles: ["trustadmin", "first_responder", "responder"]

  - title: "DOT Operations"
    url: "dispatch_dot.php"
    icon: "&#128663;"
    parent_title: "FirstResponder"
    allowed_roles: ["trustadmin", "first_responder", "responder"]

  - title: "Water Safety & Lifeguards"
    url: "dispatch_lifeguard.php"
    icon: "&#127946;"
    parent_title: "FirstResponder"
    allowed_roles: ["trustadmin", "first_responder", "responder"]

