[Unit]
Description=Isolated JavaScript/Node Backend Service
After=network.target

[Service]
User=www-data
WorkingDirectory=/var/www/app-js
ExecStart=/usr/bin/node server.js
Restart=always
RestartSec=10
Environment=NODE_ENV=production
ProtectSystem=full
NoNewPrivileges=true

[Install]
WantedBy=multi-user.target
