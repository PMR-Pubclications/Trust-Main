[Unit]
Description=Isolated JavaScript/Node Backend Service
After=network.target

[Service]
User=www-data
WorkingDirectory=/var/www/app-js
ExecStart=https://github.com/PMR-Pubclications/Trust-Main/tree/main/asset%2Fjs
Restart=always
RestartSec=10
Environment=NODE_ENV=production
ProtectSystem=full
NoNewPrivileges=true

[Install]
WantedBy=multi-user.target
