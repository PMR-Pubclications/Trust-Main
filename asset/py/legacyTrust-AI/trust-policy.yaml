trust_id: "trst_legacy_alpha_01"
trust_name: "The Legacy Trust For The Future"
version: "1.0.0"
currency: "USD"

# -----------------------------------------------------------------------------
# SPENDING THRESHOLDS & APPROVAL TIER RULES
# -----------------------------------------------------------------------------
spending_thresholds:
  - tier: 1
    name: "Automated Operational Disbursements"
    min_amount: 0.00
    max_amount: 1000.00
    approval_type: "AUTO_APPROVED"
    required_signatures: 0
    allowed_roles: []
    timelock_hours: 0

  - tier: 2
    name: "Standard Discretionary & Utility Outlays"
    min_amount: 1000.01
    max_amount: 10000.00
    approval_type: "SINGLE_SIGNATURE"
    required_signatures: 1
    allowed_roles:
      - "MANAGING_TRUSTEE"
      - "INDEPENDENT_TRUSTEE"
    timelock_hours: 0

  - tier: 3
    name: "Major Capital Expenditures & Payouts"
    min_amount: 10000.01
    max_amount: 100000.00
    approval_type: "MULTI_SIG"
    required_signatures: 2
    allowed_roles:
      - "MANAGING_TRUSTEE"
      - "INDEPENDENT_TRUSTEE"
      - "COMPLIANCE_OFFICER"
    timelock_hours: 24

  - tier: 4
    name: "Structural Portfolio Liquidation or Trust Amendment"
    min_amount: 100000.01
    max_amount: null # Unlimited
    approval_type: "UNANIMOUS"
    required_signatures: 3
    allowed_roles:
      - "MANAGING_TRUSTEE"
      - "INDEPENDENT_TRUSTEE"
      - "COMPLIANCE_OFFICER"
    timelock_hours: 72

# -----------------------------------------------------------------------------
# GOVERNANCE & MULTI-SIG TRUSTEE CONFIGURATION
# -----------------------------------------------------------------------------
governance:
  multisig_quorum: 2
  timelock_override_allowed: false
  trustees:
    - id: "tru_01"
      name: "Managing Trustee"
      role: "MANAGING_TRUSTEE"
      pubkey_or_address: "0x71C7656EC7ab88b098defB751B7401B5f6d8976F"
      email: "managing@legacytrust.org"

    - id: "tru_02"
      name: "Fiduciary Council Trustee"
      role: "INDEPENDENT_TRUSTEE"
      pubkey_or_address: "0x2546BcD33B7f16463F15302306386522c07019fE"
      email: "fiduciary@legacytrust.org"

    - id: "tru_03"
      name: "Compliance Officer"
      role: "COMPLIANCE_OFFICER"
      pubkey_or_address: "0xF39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      email: "compliance@legacytrust.org"

# -----------------------------------------------------------------------------
# BENEFICIARY PAYOUT SCHEDULES & CONDITIONS
# -----------------------------------------------------------------------------
beneficiary_payouts:
  - schedule_id: "sched_monthly_stipend_01"
    beneficiary_id: "ben_youth_foster_01"
    beneficiary_name: "Youth Transition Allowance"
    payout_type: "STIPEND"
    calculation_method: "FIXED_AMOUNT"
    amount_value: 1200.00
    frequency: "MONTHLY"
    start_date: "2026-10-01"
    end_date: "2028-10-01"
    destination_account_id: "acc_bank_beneficiary_01"
    conditions:
      - type: "AGE_GTE"
        operator: ">="
        value: 18
      - type: "PORTFOLIO_NAV_GTE"
        operator: ">="
        value: 250000.00 # Ensures trust retains minimum capital buffer

  - schedule_id: "sched_tuition_reimbursement"
    beneficiary_id: "ben_education_grant"
    beneficiary_name: "Vocational & Higher Ed Grant"
    payout_type: "EDUCATION"
    calculation_method: "FIXED_AMOUNT"
    amount_value: 5000.00
    frequency: "QUARTERLY"
    start_date: "2026-10-01"
    end_date: null
    destination_account_id: "acc_bank_registrar_direct"
    conditions:
      - type: "MIN_GPA"
        operator: ">="
        value: 3.0
      - type: "PROOFS_ATTACHED"
        operator: "=="
        value: true # Requires verified transcript or tuition invoice in OCR pipeline


if __name__ == "__main__":
    # Initialize engine with $5M activation threshold
    enforcer = TrustRuleEnforcer(
        policy_yaml_path="trust-policy.yaml",
        activation_threshold=Decimal("5000000.00")
    )

    # Sample Disbursement: $25,000 Capital Transfer
    disbursement = ProposedDisbursement(
        disbursement_id="tx_capital_outlay_101",
        amount=Decimal("25000.00"),
        description="Property Upgrade Invoice #402",
        beneficiary_id="ben_youth_foster_01",
        beneficiary_age=20,
        has_attached_proofs=True
    )

    # -------------------------------------------------------------
    # CASE 1: Account balances total $3.2 Million (Below $5M Threshold)
    # -------------------------------------------------------------
    low_nav_accounts = [
        AccountBalance(account_id="acc_1", account_name="Plaid Checking", balance=Decimal("200000.00")),
        AccountBalance(account_id="acc_2", account_name="Alpaca Treasury", balance=Decimal("3000000.00"))
    ]

    result_case1 = enforcer.evaluate_disbursement(disbursement, low_nav_accounts)
    
    print("=== CASE 1: NAV BELOW $5M (DORMANT MODE) ===")
    print(f"Total Trust NAV:     ${result_case1.total_trust_nav:,.2f}")
    print(f"Engine State:        {result_case1.engine_state.value}")
    print(f"Decision:            {result_case1.decision.value}")
    print(f"Signatures Needed:   {result_case1.required_signatures}")
    print(f"Reason:              {result_case1.reason}\n")

    # -------------------------------------------------------------
    # CASE 2: Account balances total $6.5 Million (Above $5M Threshold)
    # -------------------------------------------------------------
    high_nav_accounts = [
        AccountBalance(account_id="acc_1", account_name="Plaid Checking", balance=Decimal("500000.00")),
        AccountBalance(account_id="acc_2", account_name="Alpaca Treasury", balance=Decimal("6000000.00"))
    ]

    result_case2 = enforcer.evaluate_disbursement(disbursement, high_nav_accounts)

    print("=== CASE 2: NAV ABOVE $5M (ACTIVE ENFORCEMENT) ===")
    print(f"Total Trust NAV:     ${result_case2.total_trust_nav:,.2f}")
    print(f"Engine State:        {result_case2.engine_state.value}")
    print(f"Decision:            {result_case2.decision.value}")
    print(f"Applied Tier:        Tier {result_case2.applied_tier}")
    print(f"Signatures Needed:   {result_case2.required_signatures}")
    print(f"Allowed Roles:       {result_case2.allowed_roles}")
    print(f"Timelock Hours:      {result_case2.timelock_hours}")
    print(f"Reason:              {result_case2.reason}")

