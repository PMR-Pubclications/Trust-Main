<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSea NFT Receiver & Trading Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0e14;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 15px;
    }

    h1 {
      color: #58a6ff;
      margin-bottom: 24px;
      font-size: 1.8rem;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 720px;
      background: #161b22;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #30363d;
    }

    input, select, button {
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #58a6ff;
    }

    input.address {
      flex: 2;
      min-width: 220px;
    }

    input.token-id {
      flex: 1;
      min-width: 90px;
    }

    button {
      background: #238636;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      padding: 12px 20px;
    }

    button:hover {
      background: #2ea043;
    }

    .status-msg {
      margin: 15px 0;
      font-size: 14px;
      color: #8b949e;
      display: none;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      display: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .card img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      background-color: #010409;
    }

    .card-content {
      padding: 20px;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #f0f6fc;
      margin-bottom: 16px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #21262d;
      font-size: 14px;
    }

    .info-label {
      color: #8b949e;
    }

    .info-value {
      font-weight: 600;
      color: #f0f6fc;
      text-align: right;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-action {
      flex: 1;
      text-align: center;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
      transition: opacity 0.2s;
    }

    .btn-buy {
      background-color: #1f6feb;
      color: #ffffff;
    }

    .btn-sell {
      background-color: #da3633;
      color: #ffffff;
    }

    .btn-action:hover {
      opacity: 0.9;
    }
  .skip-link { position: absolute; left: 8px; top: -60px; background: #f8fafc; color: #020617; padding: 10px 16px; border-radius: 4px; z-index: 100; }
    .skip-link:focus { top: 8px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    :focus-visible { outline: 3px solid #fbbf24; outline-offset: 2px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main id="main-content" tabindex="-1">
  <h1>OpenSea NFT Receiver Dashboard</h1>

  <form class="controls" id="nftForm" aria-label="NFT lookup">
    <label for="chainSelect" class="sr-only">Blockchain</label>
    <select id="chainSelect">
      <option value="ethereum">Ethereum</option>
      <option value="polygon">Polygon</option>
      <option value="arbitrum">Arbitrum</option>
      <option value="optimism">Optimism</option>
      <option value="base">Base</option>
    </select>

    <label for="contractAddress" class="sr-only">Contract address</label>
    <input type="text" id="contractAddress" class="address" placeholder="Contract Address" value="0xBC4CA0EdA7647A8aB7C2061c2E118A18a936f13D">
    <label for="tokenId" class="sr-only">Token ID</label>
    <input type="text" id="tokenId" class="token-id" placeholder="Token ID" value="1">
    
    <button type="submit">Fetch NFT</button>
  </form>

  <div id="statusMsg" class="status-msg" role="status" aria-live="polite">Fetching NFT details...</div>

  <div id="nftCard" class="card" aria-live="polite">
    <img id="nftImage" src="" alt="Artwork for the NFT shown in this card">
    <div class="card-content">
      <div id="nftName" class="card-title">-</div>

      <div class="info-row">
        <span class="info-label">Floor Cost / Price</span>
        <span id="nftCost" class="info-value">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">Trading Volume</span>
        <span id="nftVolume" class="info-value">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">Last Purchased Date</span>
        <span id="lastSaleDate" class="info-value">-</span>
      </div>

      <div class="info-row">
        <span class="info-label">Last Sale Price</span>
        <span id="lastSalePrice" class="info-value">-</span>
      </div>

      <div class="action-buttons">
        <a id="buyLink" class="btn-action btn-buy" target="_blank" rel="noopener noreferrer" href="#">Buy<span class="sr-only"> (opens in a new tab)</span></a>
        <a id="sellLink" class="btn-action btn-sell" target="_blank" rel="noopener noreferrer" href="#">Sell<span class="sr-only"> (opens in a new tab)</span></a>
      </div>
    </div>
  </div>

  </main>

  <!-- Embedded OpenSea Receiver Script -->
  <script>
    /**
     * OpenSea Receiver Module
     * Handles API requests to OpenSea v2 and DOM updates directly inside the browser.
     */
    const OpenSeaReceiver = (() => {
      const CONFIG = {
        apiKey: 'f25c57a885754235a82996ee8ed9b342',
        baseUrl: 'https://api.opensea.io/api/v2'
      };

      const getHeaders = () => ({
        'accept': 'application/json',
        'x-api-key': CONFIG.apiKey
      });

      const updateStatus = (message, isError = false) => {
        const statusEl = document.getElementById('statusMsg');
        statusEl.style.display = message ? 'block' : 'none';
        statusEl.style.color = isError ? '#f85149' : '#8b949e';
        statusEl.innerText = message;
      };

      const fetchMetadata = async (chain, address, tokenId) => {
        const url = `${CONFIG.baseUrl}/chain/${chain}/contract/${address}/nfts/${tokenId}`;
        const response = await fetch(url, { headers: getHeaders() });
        if (!response.ok) throw new Error(`NFT fetch failed (Status ${response.status})`);
        const data = await response.json();
        return data.nft || {};
      };

      const fetchCollectionStats = async (collectionSlug) => {
        if (!collectionSlug) return { floorPrice: 'N/A', totalVolume: 'N/A' };
        try {
          const url = `${CONFIG.baseUrl}/collections/${collectionSlug}/stats`;
          const response = await fetch(url, { headers: getHeaders() });
          if (!response.ok) return { floorPrice: 'N/A', totalVolume: 'N/A' };
          
          const data = await response.json();
          const stats = data.total || {};
          return {
            floorPrice: stats.floor_price ? `${stats.floor_price.toFixed(4)} ETH` : 'N/A',
            totalVolume: stats.volume ? `${stats.volume.toFixed(2)} ETH` : 'N/A'
          };
        } catch (e) {
          console.warn('Collection stats error:', e);
          return { floorPrice: 'N/A', totalVolume: 'N/A' };
        }
      };

      const fetchLastSale = async (chain, address, tokenId) => {
        try {
          const url = `${CONFIG.baseUrl}/events/chain/${chain}/contract/${address}/nfts/${tokenId}?event_type=sale&limit=1`;
          const response = await fetch(url, { headers: getHeaders() });
          if (!response.ok) return { date: 'N/A', price: 'No sales record' };

          const data = await response.json();
          const events = data.asset_events || [];
          
          if (events.length > 0) {
            const sale = events[0];
            const decimals = sale.payment?.decimals || 18;
            const rawQuantity = sale.payment?.quantity;
            const price = rawQuantity 
              ? (parseFloat(rawQuantity) / Math.pow(10, decimals)).toFixed(4)
              : 'N/A';
            const symbol = sale.payment?.symbol || 'ETH';
            const date = sale.event_timestamp 
              ? new Date(sale.event_timestamp * 1000).toLocaleString() 
              : 'N/A';

            return { date, price: `${price} ${symbol}` };
          }
        } catch (e) {
          console.warn('Sale event error:', e);
        }
        return { date: 'N/A', price: 'No prior sales found' };
      };

      const renderUI = (data) => {
        document.getElementById('nftImage').src = data.image;
        document.getElementById('nftName').innerText = data.name;
        document.getElementById('nftCost').innerText = data.cost;
        document.getElementById('nftVolume').innerText = data.tradingVolume;
        document.getElementById('lastSaleDate').innerText = data.lastPurchased.date;
        document.getElementById('lastSalePrice').innerText = data.lastPurchased.price;

        // Routing URLs for Buy and Sell actions
        document.getElementById('buyLink').href = `https://opensea.io/assets/${data.chain}/${data.address}/${data.tokenId}`;
        document.getElementById('sellLink').href = `https://opensea.io/account`;

        document.getElementById('nftCard').style.display = 'block';
      };

      const fetchData = async () => {
        const chain = document.getElementById('chainSelect').value;
        const address = document.getElementById('contractAddress').value.trim();
        const tokenId = document.getElementById('tokenId').value.trim();

        if (!address || !tokenId) {
          alert('Please enter both contract address and Token ID.');
          return;
        }

        updateStatus('Requesting data from OpenSea API...');
        document.getElementById('nftCard').style.display = 'none';

        try {
          // 1. Get NFT Metadata
          const nft = await fetchMetadata(chain, address, tokenId);

          // 2. Get Stats & Sales concurrently
          const [stats, lastSale] = await Promise.all([
            fetchCollectionStats(nft.collection),
            fetchLastSale(chain, address, tokenId)
          ]);

          // 3. Render
          renderUI({
            name: nft.name || `#${tokenId}`,
            image: nft.image_url || nft.display_image_url || 'https://via.placeholder.com/400?text=No+Image',
            cost: stats.floorPrice,
            tradingVolume: stats.totalVolume,
            lastPurchased: lastSale,
            chain,
            address,
            tokenId
          });

          updateStatus('');
        } catch (err) {
          console.error(err);
          updateStatus(err.message || 'Failed to fetch NFT data.', true);
        }
      };

      return { fetchData };
    })();

    // Run automatically on page load for the default values
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('nftForm').addEventListener('submit', (e) => {
        e.preventDefault();
        OpenSeaReceiver.fetchData();
      });
      OpenSeaReceiver.fetchData();
    });
  </script>
</body>
</html>
