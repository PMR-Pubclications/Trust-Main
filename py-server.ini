[Unit]
Description=Isolated Python Backend Service
After=network.target

[Service]
User=www-data
WorkingDirectory=/var/www/app-python
ExecStart=/var/www/app-python/venv/bin/python main.py
Restart=always
RestartSec=10
# Security isolation
ProtectSystem=full
NoNewPrivileges=true

[Install]
WantedBy=multi-user.target
