[Unit]
Description=Isolated Java Backend Service
After=network.target

[Service]
User=www-data
WorkingDirectory=/var/www/app-java
ExecStart=https://github.com/PMR-Pubclications/Trust-Main/tree/main/asset%2Fjava
Restart=always
RestartSec=10
ProtectSystem=full
NoNewPrivileges=true

[Install]
WantedBy=multi-user.target
