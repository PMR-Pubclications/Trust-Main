<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framework Onboarding | Trust & Automated Governance</title>
    <style>
        :root {
            --bg-deep: #020617;
            --panel-main: #0f172a;
            --card-surface: #1e293b;
            --border-line: #475569;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #16a34a;
            --accent-hover: #22c55e;
            --accent-info: #0284c7;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .onboard-container {
            width: 100%;
            max-width: 550px;
            background-color: var(--panel-main);
            border: 2px solid var(--border-line);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        h1 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 5px;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-deep);
            border: 2px solid var(--border-line);
            color: var(--text-primary);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            border-color: var(--accent-info);
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-green);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        #response-box {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            display: none;
        }
        .success { background-color: #064e3b; border: 1px solid #34d399; color: #34d399; }
        .error { background-color: #7f1d1d; border: 1px solid #f87171; color: #f87171; }
    </style>
</head>
<body>

    <div class="onboard-container">
        <h1>Framework Onboarding</h1>
        <div class="subtitle">Initialize repository parameters and generate secure cryptographic credentials.</div>

        <form id="onboard-form" onsubmit="submitOnboarding(event)">
            <div class="form-group">
                <label for="owner_name">GitHub Owner / Handle</label>
                <input type="text" id="owner_name" required placeholder="e.g., Tole1775">
            </div>

            <div class="form-group">
                <label for="repo_name">Repository Name</label>
                <input type="text" id="repo_name" required placeholder="e.g., Trust">
            </div>

            <div class="form-group">
                <label for="organization">Organization / Entity</label>
                <input type="text" id="organization" value="PMR Publications">
            </div>

            <div class="form-group">
                <label for="contact_email">Administrative Contact Email</label>
                <input type="email" id="contact_email" placeholder="Optional contact email">
            </div>

            <button type="submit" class="btn">🔑 Generate Key & Save Profile</button>
        </form>

        <div id="response-box"></div>
    </div>

    <script>
        async function submitOnboarding(event) {
            event.preventDefault();

            const payload = {
                owner_name: document.getElementById('owner_name').value.trim(),
                repo_name: document.getElementById('repo_name').value.trim(),
                organization: document.getElementById('organization').value.trim(),
                contact_email: document.getElementById('contact_email').value.trim()
            };

            const responseBox = document.getElementById('response-box');
            responseBox.style.display = 'block';
            responseBox.className = '';
            responseBox.innerText = '[PROCESSING] Generating private key and writing to database...';

            try {
                const res = await fetch('http://localhost:3000/api/onboard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Server error occurred.');

                responseBox.className = 'success';
                responseBox.innerHTML = `<strong>SUCCESS:</strong> ${data.message}<br><br>Profile ID: ${data.profile_id}<br>Key Preview: <code>${data.generated_key_preview}</code>`;
                
                // Save config locally for subsequent portal use
                localStorage.setItem('cfg_owner', payload.owner_name);
                localStorage.setItem('cfg_repo', payload.repo_name);

            } catch (err) {
                responseBox.className = 'error';
                responseBox.innerText = `[ERROR] ${err.message}`;
            }
        }

<!-- HR Fingerprint & Biometric Registration Card -->
<div class="card" style="border-color: var(--accent-info); margin-top: 20px;">
    <h3 style="font-size: 16px; color: var(--text-primary); border-bottom: 2px solid var(--border-line); padding-bottom: 10px;">
        👆 Personnel Biometric & Fingerprint Enrollment Layer
    </h3>
    <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 15px;">
        Register hardware-vetted biometric credentials (Fingerprint/Passkey) for personnel access control. Records are saved locally and synced directly to the GitHub repository.
    </p>

    <div class="form-group">
        <label for="personnel-id">Personnel Identifier / Badge Number</label>
        <input type="text" id="personnel-id" placeholder="e.g., EMP-2026-042">
    </div>

    <div class="form-group">
        <label for="personnel-name">Full Legal Name</label>
        <input type="text" id="personnel-name" placeholder="e.g., Anthony Antolic">
    </div>

    <button class="btn btn-secondary" onclick="biometricEnrollment.registerFingerprint()">
        🔒 Scan Fingerprint & Enroll Credential
    </button>

    <div id="enrollment-console" style="margin-top: 15px; font-family: monospace; font-size: 11px; color: #38bdf8; background: var(--bg-deep); padding: 10px; border-radius: 6px; border: 1px solid var(--border-line); display: none;">
        [BIOMETRIC] System ready for hardware enrollment...
    </div>
</div>


    const biometricEnrollment = {
        async registerFingerprint() {
            const personnelId = document.getElementById('personnel-id').value.trim();
            const personnelName = document.getElementById('personnel-name').value.trim();
            const consoleBox = document.getElementById('enrollment-console');

            if (!personnelId || !personnelName) {
                alert('Please enter both Personnel ID and Full Legal Name before scanning biometrics.');
                return;
            }

            consoleBox.style.display = 'block';
            consoleBox.innerText = `[1/3] Prompting hardware biometric sensor for [${personnelName}]...`;

            try {
                // Check if WebAuthn (Fingerprint/Passkey hardware) is supported
                if (!window.PublicKeyCredential) {
                    throw new Error('WebAuthn biometric hardware API is not supported on this browser/device.');
                }

                // Generate a random challenge for cryptographic binding
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);

                const publicKeyCredentialCreationOptions = {
                    challenge: challenge,
                    rp: {
                        name: "Trust Governance Framework HR",
                        id: window.location.hostname,
                    },
                    user: {
                        id: Uint8Array.from(personnelId, c => c.charCodeAt(0)),
                        name: personnelId,
                        displayName: personnelName,
                    },
                    pubKeyCredParams: [{ alg: -7, type: "public-key" }], // ES256
                    timeout: 60000,
                    attestation: "direct",
                    authenticatorSelection: {
                        authenticatorAttachment: "platform", // Uses built-in fingerprint/TouchID/Windows Hello
                        userVerification: "required",
                        residentKey: "preferred"
                    }
                };

                // Trigger hardware biometric prompt (Fingerprint reader)
                const credential = await navigator.credentials.create({
                    publicKey: publicKeyCredentialCreationOptions
                });

                consoleBox.innerText += `\n[2/3] Biometric credential successfully captured. Serializing payload...`;

                // Extract credential details safely
                const credentialIdB64 = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
                const timestamp = new Date().toISOString();

                const biometricRecord = {
                    personnel_id: personnelId,
                    name: personnelName,
                    credential_id: credentialIdB64,
                    enrollment_type: "hardware_biometric_fingerprint",
                    timestamp: timestamp,
                    status: "ACTIVE_VERIFIED"
                };

                // 1. Save Locally (localStorage)
                const localKey = `hr_bio_${personnelId}`;
                localStorage.setItem(localKey, JSON.stringify(biometricRecord));

                consoleBox.innerText += `\n[3/3] Saved locally. Committing record to GitHub repository...`;

                // 2. Commit to GitHub Repository
                await this.commitToGitHub(biometricRecord);

                consoleBox.innerText += `\n[SUCCESS] Biometric fingerprint record registered and synced across local and cloud databases.`;
                alert(`Fingerprint successfully enrolled for ${personnelName}!`);

            } catch (err) {
                consoleBox.innerText += `\n[ERROR] Enrollment failed: ${err.message}`;
                console.error(err);
            }
        },

        async commitToGitHub(record) {
            const owner = localStorage.getItem('cfg_owner') || 'Tole1775';
            const repo = localStorage.getItem('cfg_repo') || 'Trust';
            const token = localStorage.getItem('secure_access_token') ? atob(localStorage.getItem('secure_access_token')) : '';

            if (!token) {
                throw new Error('GitHub secure access token missing. Configure repository credentials first.');
            }

            const filePath = `database/hr/biometrics_${record.personnel_id}.json`;
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`;
            const fileContentB64 = btoa(JSON.stringify(record, null, 2));

            // Check if file already exists to get its SHA (required for GitHub updates)
            let fileSha = null;
            try {
                const checkRes = await fetch(apiUrl, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (checkRes.ok) {
                    const fileData = await checkRes.json();
                    fileSha = fileData.sha;
                }
            } catch (e) {
                // File likely doesn't exist yet, which is fine for new records
            }

            const commitPayload = {
                message: `HR: Enroll biometric fingerprint record for ${record.personnel_id}`,
                content: fileContentB64,
                sha: fileSha
            };

            const putRes = await fetch(apiUrl, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(commitPayload)
            });

            if (!putRes.ok) {
                const errData = await putRes.json();
                throw new Error(`GitHub Commit Failed: ${errData.message}`);
            }
        }
    };
</script>

</body>
</html>
