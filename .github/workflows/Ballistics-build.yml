name: Build C++ and Java Engines

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-cpp-engine:
    name: Build C++ Audio/Video Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install C++ Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake g++
          
      - name: Build C++ Engine
        run: |
          cd audio_video_engine
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

  build-java-ballistics:
    name: Build Java Ballistics Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Java Package (FAT JAR)
        run: |
          cd ballistics_analysis
          mvn clean package
