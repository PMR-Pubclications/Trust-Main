name: Automated Trust Runner

on:
  push:
    branches:
      - main

jobs:
  execute-trust-verification:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Detect version
        run: node .github/workflows/detect-version.js

      - name: Make script executable and run trust check
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: |
          chmod +x ./run-trust-check.sh
          ./run-trust-check.sh
