name: Secure Asset Organization and Firewall

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Asset Organizer
        run: javac SecureAssetFirewall.java

      - name: Execute Organization Script
        run: java SecureAssetFirewall

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated asset organization and security firewall sorting [skip ci]"
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: "assets/ *"
