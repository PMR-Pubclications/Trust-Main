name: Publish to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ docker login -u tolie1775 }}
          password: ${{ dckr_pat_bFuVPjRJSsHyFaTmUuQQ1vQGD4s }}

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/legacy-trust-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/legacy-trust-backend:${{ github.sha }}
